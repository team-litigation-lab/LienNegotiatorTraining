<!DOCTYPE html>
<html lang="en">
<head>

<title>LSH Lien Negotiator Training</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* The base tokens and building blocks are the CM course's (Case-Management-Training/index.html), so the two
   programs look the same; the classes keep their names there (.topbar, .card, .module-card, .page-hero). */
:root{
  --navy:#262B45;
  --navy-deep:#161829;
  --navy-soft:#3C4268;
  --orange:#DB8437;
  --orange-deep:#B5651F;
  --orange-soft:#F0C08A;
  --bg:#EEF0F6;
  --paper:#FFFFFF;
  --ink:#1B1E2E;
  --ink-soft:#2B2F3E;
  --line:#DCE0EA;
  --success:#3F7D58;
  --success-bg:rgba(231,241,234,.62);
  --danger:#9B3A30;
  --danger-bg:rgba(247,233,230,.62);
  --radius:14px;
  --shadow:0 1px 2px rgba(22,24,41,.04), 0 8px 24px -12px rgba(22,24,41,.18);
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-body:14px;
  --font-sub:12px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-weight:700;font-size:17px;-webkit-font-smoothing:antialiased;line-height:1.5;position:relative;}
/* The page backdrop. This program has no photo of its own yet: a soft wash stands in for it (see README,
   "The standard page style", for adding one). */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;top:58px;
  background:radial-gradient(1100px 600px at 100% 100%, rgba(219,132,55,.35), transparent 60%),
             radial-gradient(900px 520px at 0% 0%, rgba(60,66,104,.35), transparent 60%),#F4F5FA;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3,h4,.display{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.005em;font-weight:600;}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--orange-soft);}

/* ---------- top bar ---------- */
.topbar{background:var(--navy);color:#fff;position:-webkit-sticky;position:sticky;top:0;z-index:40;box-shadow:0 2px 16px rgba(0,0,0,.15);}
.topbar-inner{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;row-gap:10px;}
.brand{display:flex;align-items:center;gap:18px;cursor:pointer;flex:0 1 auto;min-width:0;background:none;border:0;color:inherit;padding:0;}
.brand-mark{height:40px;width:auto;flex:0 0 auto;object-fit:contain;display:block;}
.brand-text b{font-family:var(--font-ui);font-size:15px;font-weight:800;letter-spacing:.075em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0;}
.nav{display:flex;gap:2px;background:rgba(255,255,255,.06);padding:4px;border-radius:10px;flex-wrap:wrap;}
.nav button,.nav a{background:transparent;border:none;color:#D7DAEC;font-size:13px;font-weight:600;padding:8px 10px;border-radius:7px;white-space:nowrap;text-decoration:none;}
.nav button.active{background:var(--orange);color:#241304;}
.nav button:not(.active):hover,.nav a:hover{background:rgba(255,255,255,.09);color:#fff;}
.who{font-size:12.5px;color:#C9CDE3;font-weight:600;white-space:nowrap;}

main{flex:1;max-width:1400px;margin:0 auto;padding:32px 20px 60px;width:100%;}
.footer-note{text-align:center;font-size:var(--font-sub);color:var(--ink-soft);padding:20px 24px 32px;}

/* ---------- building blocks ---------- */
.eyebrow{font-size:var(--font-sub);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-deep);margin:0 0 8px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:var(--font-body);padding:10px 18px;transition:transform .12s ease, background .15s ease, color .15s ease, box-shadow .15s ease;text-decoration:none;}
.btn:not([disabled]):hover{transform:translateY(-1px);}
.btn-primary{background:var(--orange);color:#241304;}
.btn-primary:hover{background:var(--orange-deep);color:#fff;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--navy-soft);background:#F6F7FB;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-deep);}
.btn[disabled]{opacity:.42;cursor:not-allowed;pointer-events:none;}
.btn-sm{padding:7px 13px;font-size:var(--font-sub);}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;letter-spacing:.03em;}
.pill-done{background:var(--success-bg);color:var(--success);border:1px solid rgba(63,125,88,.35);}
.pill-open{background:rgba(219,132,55,.14);color:#7A3F0C;border:1px solid rgba(219,132,55,.4);}
.pill-new{background:rgba(60,66,104,.1);color:var(--navy);border:1px solid rgba(60,66,104,.25);}
.toast{position:fixed;top:78px;right:20px;max-width:min(380px, calc(100vw - 40px));line-height:1.4;background:var(--navy);color:#fff;padding:11px 20px;border-radius:9px;font-size:var(--font-body);box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:200;opacity:0;pointer-events:none;transform:translateY(-6px);transition:opacity .25s ease, transform .25s ease;}
.toast.show{opacity:1;transform:translateY(0);}
.login-shell{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--paper);border-radius:16px;padding:32px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow);}

.page-hero{position:relative;overflow:hidden;border-radius:20px;padding:30px 34px 24px;margin-bottom:22px;
  background:radial-gradient(900px 320px at 85% -20%, rgba(219,132,55,.28), transparent 60%),
             radial-gradient(600px 300px at -5% 120%, rgba(120,132,190,.25), transparent 60%),
             linear-gradient(135deg, #1F2440 0%, #2B3158 55%, #353C68 100%);
  box-shadow:0 18px 40px -22px rgba(20,24,48,.65);color:#fff;}
.page-hero::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(rgba(255,255,255,.9) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.9) 1px, transparent 1px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 55%, transparent 100%);mask-image:linear-gradient(90deg, transparent 0%, #000 55%, transparent 100%);}
.page-hero > *{position:relative;z-index:1;}
.page-hero .eyebrow{display:inline-block;margin:0 0 12px;padding:5px 12px;border-radius:999px;background:rgba(219,132,55,.16);border:1px solid rgba(240,192,138,.45);color:#F5C99A;font-size:11.5px;letter-spacing:.14em;}
.page-hero h1{color:#fff;font-size:clamp(24px, 2.6vw, 36px);line-height:1.18;margin:0 0 10px;font-weight:700;}
.page-hero p.lead{color:#C9CDE3;font-size:15px;line-height:1.6;max-width:72ch;margin:0;font-weight:500;}


/* ---------- day cards (the CM course's: DAY n and the title in the head, the icon and theme, Start) ---------- */
.module-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:18px;align-items:stretch;}
.module-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
.module-head{background:linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);color:#fff;text-align:center;padding:10px 12px 11px;min-height:62px;display:flex;flex-direction:column;justify-content:center;}
.module-card:nth-child(2n) .module-head{background:linear-gradient(135deg, var(--orange) 0%, var(--orange-deep) 100%);color:#241304;}
.mh-day{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:2px;}
.mh-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.25;}
.module-body{padding:16px 18px 10px;flex:1;display:flex;flex-direction:column;gap:10px;}
.module-icon{text-align:center;font-size:34px;line-height:1;margin:4px 0 2px;}
.module-theme{text-align:center;font-size:14px;font-weight:500;color:var(--ink);line-height:1.5;}
.module-topic-list{list-style:none;margin:4px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-soft);}
.module-topic-list li{padding:3px 0;}
.day-count{font-size:12px;color:var(--ink-soft);font-weight:600;}
.module-start-btn{margin:6px 18px 18px;}
.mnum{font-family:'IBM Plex Mono';font-size:var(--font-sub);color:var(--orange-deep);font-weight:700;letter-spacing:.04em;}

/* ---------- a day's modules ---------- */
.mod-list{display:flex;flex-direction:column;gap:12px;}
.mod-row{display:flex;align-items:center;gap:16px;padding:16px 18px;flex-wrap:wrap;}
.mod-row-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--g-navy, var(--navy));color:#fff;flex:0 0 auto;}
.mod-row-main{flex:1 1 220px;min-width:0;}
.mod-row-main h3{margin:2px 0 0;font-size:18px;color:var(--navy);}
.pager{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

/* ---------- module page ---------- */
.mod-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;}
@media(max-width:1000px){.mod-layout{grid-template-columns:1fr;}}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0f1324;box-shadow:var(--shadow);}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.frame-note{font-size:12.5px;color:var(--ink-soft);margin:8px 2px 0;font-weight:500;}
.frame-note a{color:var(--orange-deep);font-weight:700;}
.side{padding:18px;}
.side h3{margin:0 0 6px;font-size:17px;color:var(--navy);}
.side-note{font-size:13px;color:var(--ink-soft);font-weight:500;margin:4px 0 12px;}
.mark-btn{width:100%;}
.empty{padding:30px;text-align:center;color:var(--ink-soft);font-weight:600;}

/* ---------- admin ---------- */
.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;vertical-align:middle;}
.table-wrap{overflow-x:auto;}
.field{display:block;margin:0 0 14px;}
.field span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
.field input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font:500 13px 'IBM Plex Mono',monospace;background:#fff;}
.sec{padding:20px 22px;margin-bottom:18px;}
.sec h2{margin:0 0 4px;font-size:20px;color:var(--navy);}
.sec > p{margin:0 0 14px;font-size:13.5px;color:var(--ink-soft);font-weight:500;}
@media(max-width:760px){.page-hero{padding:20px 16px;border-radius:16px;} main{padding:20px 16px 40px;} 
/* ============================================================================
   The LSH standard page style — the see-through surfaces every LSH site shares.
   A vendored copy of the block at the end of the CM course's <style> (itself a copy of the Training Portal's
   theme.css). The Portal's README, under "The standard page style", is the source of truth; change it there
   first and copy the block down.
   ========================================================================= */
:root{
  --surface-glass:rgba(255,255,255,.60);
  --surface-blur:saturate(118%) blur(10px);
}
body::before{opacity:.40;}
.module-card,
.card{
  background:var(--surface-glass);
  backdrop-filter:var(--surface-blur);
  -webkit-backdrop-filter:var(--surface-blur);
}
.eyebrow{color:var(--navy);}
.footer-note,.footer-note span{color:var(--ink);}
@media print{
  body::before{display:none;}
  .module-card,.card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;}
}
:root{
  --g-navy:linear-gradient(135deg,var(--navy-deep) 0%,var(--navy) 55%,var(--navy-soft) 100%);
  --g-accent:linear-gradient(135deg,var(--orange) 0%,#E59A52 55%,#EFA560 100%);
  --edge-cyan:rgba(56,189,248,.38);
  --glow-navy:0 12px 30px -16px rgba(22,24,41,.65);
  --glow-accent:0 10px 26px -14px rgba(219,132,55,.55);
  --glow-cyan:0 0 0 1px rgba(56,189,248,.30),0 10px 26px -16px rgba(56,189,248,.5);
}
.topbar{background-image:var(--g-navy);box-shadow:inset 0 -1px 0 var(--edge-cyan),var(--glow-navy);}
.btn-primary{background-image:var(--g-accent);box-shadow:var(--glow-accent);}
.btn-navy{background-image:var(--g-navy);box-shadow:var(--glow-navy);}
.btn-primary:not([disabled]):hover,.btn-navy:not([disabled]):hover{box-shadow:var(--glow-cyan);}
.module-card,.card{transition:box-shadow .22s ease,transform .16s ease;}
.module-card:hover,.card:hover{box-shadow:0 18px 38px -22px rgba(22,24,41,.55),0 0 0 1px var(--edge-cyan);}
@media (prefers-reduced-motion: reduce){
  .module-card,.card{transition:none;}
}
@media print{
  .topbar,.btn-primary,.btn-navy{background-image:none;box-shadow:none;}
}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   The page engine. A small one: the dashboard, one page per module (its Canva deck and its recorded
   session), and the Admin screen. It provides what js/portal-gate.js (the same file in every LSH course
   repo) expects of an engine: state, render(), goto(), authStatus(), logout(), setAdminToken(),
   setTraineeToken(), submitLogin() and resumeWhereLeftOff().
   ============================================================ */
const APP_BUILD = "2026.11.11-2";
const PORTAL_HOME = "https://cm-training-activity.pages.dev/";
const LOGO_FULL_SRC = "/logo.svg";
const COURSE = window.LN_COURSE;
const TOKEN_KEYS = { admin: "ln.adminToken", trainee: "ln.traineeToken", last: "ln.last" };

const state = {
  view: "boot", dayNum: 1, moduleId: "",
  secure: true, portalOnly: false, portalSecret: false,
  adminToken: "", authToken: "", isAdmin: false,
  traineeId: "", trainee: null,
  courseLinks: {},          // settings:course: an admin's replacement addresses, { <module id>: { link } }
  admin: { rows: null, loading: false },
  resumePending: false
};

function esc(t){ return String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function store(k, v){ try{ if(v) localStorage.setItem(k, v); else localStorage.removeItem(k); }catch(e){} }
function stored(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- the Worker ---------- */
async function api(path, body){
  const h = {"Content-Type":"application/json"};
  const tok = state.adminToken || state.authToken;
  if(tok) h.Authorization = "Bearer " + tok;
  const r = await fetch(path, {method:"POST", headers:h, body:JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && path.startsWith("/api/storage")){ await logout(); throw new Error("Sign-in required"); }
  if(!r.ok) throw new Error(j.error || ("Request failed (" + r.status + ")"));
  return j;
}
const kvGet = async (key) => { const j = await api("/api/storage/get", {key}); try{ return j.value ? JSON.parse(j.value) : null; }catch(e){ return null; } };
const kvSet = (key, value) => api("/api/storage/set", {key, value: JSON.stringify(value)});

/* ---------- the hooks js/portal-gate.js calls ---------- */
async function authStatus(){
  try{
    const r = await fetch("/api/auth/status", {method:"POST"});
    const j = await r.json();
    state.secure = !!j.secure; state.portalOnly = !!j.portalOnly; state.portalSecret = !!j.portalSecret;
  }catch(e){ /* offline: keep the defaults */ }
}
function tokenSubject(tok){ const p = String(tok || "").split("."); return p.length === 4 ? decodeURIComponent(p[1]) : ""; }
function setAdminToken(tok){ state.adminToken = tok || ""; state.isAdmin = !!tok; store(TOKEN_KEYS.admin, state.adminToken); }
function setTraineeToken(tok){ state.authToken = tok || ""; state.traineeId = tokenSubject(tok); store(TOKEN_KEYS.trainee, state.authToken); }
async function logout(){
  setAdminToken(""); setTraineeToken("");
  state.trainee = null; state.traineeId = ""; state.isAdmin = false; state.admin.rows = null;
  state.view = "login"; render();
}
function goto(view, arg){
  state.view = view;
  if(view === "day") state.dayNum = Number(arg) || state.dayNum;
  if(view === "module" && arg){ state.moduleId = arg; const d = dayOfModule(arg); if(d) state.dayNum = d.day; }
  if(view === "day" && !dayByNum(state.dayNum)) state.view = "dashboard";
  if(view === "module" && !moduleById(state.moduleId)) state.view = "dashboard";
  if(state.traineeId) store(TOKEN_KEYS.last, JSON.stringify({view: state.view, dayNum: state.dayNum, moduleId: state.moduleId}));
  render();
  window.scrollTo(0, 0);
}
// The Portal's ticket has already been checked and the Worker has written the trainee's record (approved);
// this reads it in and opens the dashboard.
async function submitLogin(){
  if(!state.authToken) return;
  await loadTrainee();
  state.view = traineeBlocked() ? "pendingApproval" : "dashboard";
  render();
}
function resumeWhereLeftOff(){
  state.resumePending = false;
  let last = null; try{ last = JSON.parse(stored(TOKEN_KEYS.last) || "null"); }catch(e){}
  if(last && last.view === "module" && moduleById(last.moduleId)) goto("module", last.moduleId);
  else if(last && last.view === "day" && dayByNum(last.dayNum)) goto("day", last.dayNum);
  else goto("dashboard");
}

/* ---------- the trainee's record ----------
   trainee:<id> carries dayProgress, the field the Portal's program-progress and attendance read for every course:
   { "<day>": { done, doneAt, modules: { <module id>: true } } }, plus lastActive. A day is done when all its modules are. */
async function loadTrainee(){
  if(!state.traineeId) return;
  try{ state.trainee = await kvGet("trainee:" + state.traineeId); }catch(e){ state.trainee = null; }
  if(!state.trainee) state.trainee = { id: state.traineeId, name: state.traineeId, dayProgress: {} };
  state.trainee.dayProgress = state.trainee.dayProgress || {};
  state.trainee.lastActive = new Date().toISOString();
  saveTrainee();
  api("/api/checkin", {training: COURSE.title}).catch(() => {});
}
let saveTimer = null;
function saveTrainee(){
  if(!state.traineeId || !state.trainee) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { kvSet("trainee:" + state.traineeId, state.trainee).catch(() => toast("Couldn't save your progress. Check your connection.")); }, 300);
}
function traineeBlocked(){ const t = state.trainee; return !!(t && (t.rejected || t.archived || t.approved === false)); }
async function loadCourseLinks(){ try{ state.courseLinks = (await kvGet("settings:course")) || {}; }catch(e){ state.courseLinks = {}; } }

/* ---------- the course: days, and each day's modules ---------- */
const ALL_MODULES = COURSE.days.flatMap((d) => d.modules.map((m) => Object.assign({ day: d.day }, m)));
function dayByNum(n){ return COURSE.days.find((d) => d.day === Number(n)); }
function moduleById(id){ return ALL_MODULES.find((m) => m.id === id); }
function dayOfModule(id){ const m = moduleById(id); return m ? dayByNum(m.day) : null; }
function linkOf(m){ const o = (state.courseLinks || {})[m.id]; return (o && o.link) || m.link; }
const KIND = { deck: { icon: "🎞", label: "Slide deck" }, video: { icon: "▶", label: "Recorded session" } };
function dayProg(d, rec){ const dp = ((rec || state.trainee) || {}).dayProgress || {}; return dp[d.day] || dp[String(d.day)] || {}; }
function moduleDone(m, rec){ const p = dayProg(dayByNum(m.day), rec); return !!(p.modules && p.modules[m.id]); }
function dayCount(d, rec){ return d.modules.filter((m) => moduleDone(Object.assign({ day: d.day }, m), rec)).length; }
function dayStatus(d, rec){ const n = dayCount(d, rec); return n === d.modules.length ? "done" : n ? "open" : "new"; }
function pillFor(st){ return st === "done" ? '<span class="pill pill-done">✓ Completed</span>' : st === "open" ? '<span class="pill pill-open">In progress</span>' : '<span class="pill pill-new">Not started</span>'; }
function setModuleDone(id, on){
  const m = moduleById(id); if(!state.trainee || !m) return;
  const d = dayByNum(m.day), dp = state.trainee.dayProgress;
  const p = Object.assign({}, dp[d.day] || {}); p.modules = Object.assign({}, p.modules || {});
  if(on) p.modules[id] = true; else delete p.modules[id];
  const was = !!p.done;
  p.done = d.modules.every((x) => p.modules[x.id]);
  if(p.done && !was) p.doneAt = new Date().toISOString();
  if(!p.done) delete p.doneAt;
  dp[d.day] = p;
  state.trainee.lastActive = new Date().toISOString();
  saveTrainee();
  toast(p.done && !was ? `Day ${d.day} completed. Nice work!` : on ? "Module marked complete." : "Module marked not complete.");
  render();
}

/* ---------- views ---------- */
function topbar(){
  const nav = [];
  if(state.isAdmin || state.traineeId){
    nav.push(`<button class="${state.view === "dashboard" ? "active" : ""}" onclick="goto('dashboard')">🏠 Dashboard</button>`);
    COURSE.days.forEach((d) => nav.push(`<button class="${(state.view === "day" || state.view === "module") && state.dayNum === d.day ? "active" : ""}" onclick="goto('day',${d.day})">Day ${d.day}</button>`));
    if(state.isAdmin) nav.push(`<button class="${state.view === "admin" ? "active" : ""}" onclick="goto('admin')">🛡 Admin</button>`);
    nav.push(`<a href="${PORTAL_HOME}">↩ Portal</a>`);
    nav.push(`<button onclick="logout()">Sign out</button>`);
  }
  const who = state.isAdmin ? "Trainer" : (state.trainee && state.trainee.name) || "";
  return `<header class="topbar"><div class="topbar-inner">
    <button class="brand" onclick="goto('dashboard')" aria-label="Dashboard"><img class="brand-mark" src="/js/lsh-logo-dark.png" alt="Legal Support Help"><span class="brand-text"><b>Lien Negotiator Training</b></span></button>
    <div class="topbar-right">${who ? `<span class="who">${esc(who)}</span>` : ""}${nav.length ? `<nav class="nav">${nav.join("")}</nav>` : ""}</div>
  </div></header>`;
}
function footer(){ return `<div class="footer-note">Legal Support Help · ${esc(COURSE.title)} · <span class="mono">${APP_BUILD}</span></div>`; }

// The dashboard: one Day card per day (the CM course's day cards: DAY n and the title in the head, the icon and theme, Start).
function viewDashboard(){
  return `<div class="module-grid day-grid">${COURSE.days.map((d) => {
    const st = state.isAdmin ? "new" : dayStatus(d), n = dayCount(d);
    return `<article class="module-card day-card mc-${st}" id="day-${d.day}">
      <div class="module-head"><div class="mh-day">Day ${d.day}${st === "done" ? " · Completed" : ""}</div><div class="mh-title">${esc(d.title)}</div></div>
      <div class="module-body">
        <div class="module-icon" aria-hidden="true">${d.icon}</div>
        <div class="module-theme">${esc(d.theme)}</div>
        <ul class="module-topic-list">${d.modules.map((m, i) => `<li>${!state.isAdmin && moduleDone(Object.assign({ day: d.day }, m)) ? "✅" : KIND[m.kind].icon} Module ${i + 1}: ${esc(KIND[m.kind].label)}</li>`).join("")}</ul>
        ${state.isAdmin ? "" : `<div class="day-count">${n} of ${d.modules.length} modules complete</div>`}
      </div>
      <button class="btn btn-navy module-start-btn" onclick="goto('day',${d.day})">${st === "done" ? "Review" : st === "open" ? "Continue" : "Start"}</button>
    </article>`;
  }).join("")}</div>`;
}

// A day: its modules, in order.
function viewDay(){
  const d = dayByNum(state.dayNum), i = COURSE.days.indexOf(d);
  const prev = COURSE.days[i - 1], next = COURSE.days[i + 1];
  const rows = d.modules.map((m0, j) => {
    const m = Object.assign({ day: d.day }, m0), done = !state.isAdmin && moduleDone(m);
    return `<article class="card mod-row">
      <div class="mod-row-icon" aria-hidden="true">${KIND[m.kind].icon}</div>
      <div class="mod-row-main">
        <span class="mnum">MODULE ${j + 1} · ${esc(KIND[m.kind].label.toUpperCase())}${m.slides ? ` · ${m.slides} SLIDES` : ""}</span>
        <h3>${esc(m.title)}</h3>
      </div>
      ${state.isAdmin ? "" : pillFor(done ? "done" : "new")}
      <button class="btn ${done ? "btn-ghost" : "btn-primary"} btn-sm" onclick="goto('module','${m.id}')">${done ? "Review" : "Open"} →</button>
    </article>`;
  }).join("");
  return `<section class="page-hero">
      <p class="eyebrow">Day ${d.day} of ${COURSE.days.length}</p>
      <h1>${esc(d.title)}</h1>
      <p class="lead">${esc(d.theme)}</p>
    </section>
    <div class="mod-list">${rows}</div>
    <div class="pager">
      ${prev ? `<button class="btn btn-ghost btn-sm" onclick="goto('day',${prev.day})">← Day ${prev.day}</button>` : `<button class="btn btn-ghost btn-sm" onclick="goto('dashboard')">← Dashboard</button>`}
      ${next ? `<button class="btn btn-navy btn-sm" onclick="goto('day',${next.day})">Day ${next.day} →</button>` : ""}
    </div>`;
}

// A module: its deck or its recorded session, and Mark module complete.
function viewModule(){
  const m = moduleById(state.moduleId), d = dayByNum(m.day), j = d.modules.findIndex((x) => x.id === m.id);
  const k = ALL_MODULES.indexOf(m), prev = ALL_MODULES[k - 1], next = ALL_MODULES[k + 1];
  const link = linkOf(m), src = lnEmbed.embed(m.kind, link), page = lnEmbed.page(m.kind, link);
  const frame = src
    ? `<div class="frame"><iframe src="${esc(src)}" title="${esc(m.title)}" allow="autoplay; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
       <p class="frame-note">${m.kind === "video" ? "The video plays from Google Drive. If it asks you to sign in, use your legalsupporthelp.com Google account." : "Use the arrows under the slides, or the full-screen button, to page through the deck."} <a href="${esc(page)}" target="_blank" rel="noopener">Open in a new tab ↗</a></p>`
    : `<div class="card empty">This module isn't set up yet. ${state.isAdmin ? "Add its address in Admin → Course links." : "Please tell your trainer."}</div>`;
  const done = !state.isAdmin && moduleDone(m);
  const label = (x) => { const xd = dayByNum(x.day); return `Day ${x.day} · Module ${xd.modules.findIndex((y) => y.id === x.id) + 1}`; };
  const mark = state.isAdmin
    ? `<p class="side-note">Trainees mark each module complete here. You're signed in as a trainer, so nothing is recorded.</p>`
    : `<p class="side-note">${m.kind === "video" ? "Watch the whole session" : "Go through every slide"}, then mark the module complete.</p>
       ${done ? `<div style="margin:0 0 10px">${pillFor("done")}</div><button class="btn btn-ghost btn-sm mark-btn" onclick="setModuleDone('${m.id}',false)">Mark not complete</button>`
              : `<button class="btn btn-primary mark-btn" onclick="setModuleDone('${m.id}',true)">✓ Mark module complete</button>`}`;
  return `<section class="page-hero">
      <p class="eyebrow">Day ${d.day} · Module ${j + 1} of ${d.modules.length}</p>
      <h1>${esc(m.title)}</h1>
      <p class="lead">${esc(KIND[m.kind].label)}${m.slides ? ` · ${m.slides} slides` : ""} · ${esc(d.title)}</p>
    </section>
    <div class="mod-layout">
      <div>${frame}</div>
      <aside class="card side">
        <h3>${esc(KIND[m.kind].icon + " " + KIND[m.kind].label)}</h3>
        ${mark}
        <div class="pager" style="margin-top:16px">
          <button class="btn btn-ghost btn-sm" onclick="goto('day',${d.day})">↑ Day ${d.day}</button>
          ${prev ? `<button class="btn btn-ghost btn-sm" onclick="goto('module','${prev.id}')">← ${label(prev)}</button>` : ""}
          ${next ? `<button class="btn btn-navy btn-sm" onclick="goto('module','${next.id}')">${label(next)} →</button>` : ""}
        </div>
      </aside>
    </div>`;
}

/* ---------- Admin: trainees and their progress, and the course links ---------- */
async function loadAdmin(){
  state.admin.loading = true; render();
  try{
    const {keys} = await api("/api/storage/list", {prefix: "trainee:"});
    const rows = [];
    for(let i = 0; i < keys.length; i += 100){
      const {values} = await api("/api/storage/get-many", {keys: keys.slice(i, i + 100)});
      Object.values(values).forEach((v) => { try{ const r = JSON.parse(v); if(r) rows.push(r); }catch(e){} });
    }
    rows.sort((a, b) => String(a.batch || "").localeCompare(String(b.batch || "")) || String(a.name || "").localeCompare(String(b.name || "")));
    state.admin.rows = rows;
  }catch(e){ state.admin.rows = []; toast(e.message); }
  state.admin.loading = false; render();
}
async function setTraineeFlag(id, flag){
  const r = (state.admin.rows || []).find((x) => x.id === id); if(!r) return;
  if(flag === "archive") r.archived = true;
  if(flag === "restore"){ delete r.archived; delete r.rejected; r.approved = true; }
  try{ await kvSet("trainee:" + id, r); toast(flag === "archive" ? "Access removed." : "Access restored."); }catch(e){ toast(e.message); }
  render();
}
async function saveCourseLinks(){
  const out = {};
  for(const m of ALL_MODULES){
    const v = ((document.getElementById("cl-" + m.id) || {}).value || "").trim();
    if(!v) continue;
    if(!lnEmbed.embed(m.kind, v)){ toast(`Day ${m.day}, ${KIND[m.kind].label}: the address must be a ${m.kind === "video" ? "drive.google.com/file/d/…" : "canva.com/design/…"} link.`); return; }
    out[m.id] = { link: v };
  }
  try{ await kvSet("settings:course", out); state.courseLinks = out; toast("Course links saved."); }catch(e){ toast(e.message); }
}
function viewAdmin(){
  if(state.admin.rows == null && !state.admin.loading) setTimeout(loadAdmin, 0);
  const rows = state.admin.rows || [], cols = 4 + COURSE.days.length;
  const body = state.admin.loading && !rows.length ? `<tr><td colspan="${cols}">Loading…</td></tr>`
    : !rows.length ? `<tr><td colspan="${cols}">No trainees have opened this course yet. They appear here the first time they open it from the LSH Training Portal.</td></tr>`
    : rows.map((r) => `<tr>
        <td>${esc(r.name || r.id)}</td><td class="mono">${esc(r.batch || "")}</td>
        ${COURSE.days.map((d) => `<td>${pillFor(dayStatus(d, r))} <span class="mono" style="font-size:11.5px">${dayCount(d, r)}/${d.modules.length}</span></td>`).join("")}
        <td style="font-weight:500">${r.lastActive ? esc(new Date(r.lastActive).toLocaleString()) : "—"}</td>
        <td>${r.archived || r.rejected ? `<button class="btn btn-ghost btn-sm" onclick="setTraineeFlag('${esc(r.id)}','restore')">Restore access</button>` : `<button class="btn btn-ghost btn-sm" onclick="setTraineeFlag('${esc(r.id)}','archive')">Remove access</button>`}</td>
      </tr>`).join("");
  const links = COURSE.days.map((d) => `<h3 style="margin:14px 0 8px;font-size:16px;color:var(--navy)">Day ${d.day}: ${esc(d.title)}</h3>`
    + d.modules.map((m, j) => `<label class="field"><span>Module ${j + 1} · ${esc(KIND[m.kind].label)} (blank = ${esc(m.link)})</span><input id="cl-${m.id}" value="${esc(((state.courseLinks || {})[m.id] || {}).link || "")}" placeholder="${m.kind === "video" ? "https://drive.google.com/file/d/…/view" : "https://www.canva.com/design/…/view"}"></label>`).join("")).join("");
  return `<section class="page-hero"><p class="eyebrow">Admin</p><h1>Trainees & course links</h1><p class="lead">Who has opened the course, how far each trainee is, and where each module's deck or video comes from.</p></section>
    <section class="card sec">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Trainees</h2><button class="btn btn-ghost btn-sm" onclick="loadAdmin()">↻ Refresh</button></div>
      <p>Trainees are approved on the LSH Training Portal; removing access here stops them opening this course only.</p>
      <div class="table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Batch</th>${COURSE.days.map((d) => `<th>Day ${d.day}</th>`).join("")}<th>Last active</th><th></th></tr></thead><tbody>${body}</tbody></table></div>
    </section>
    <section class="card sec">
      <h2>Course links</h2>
      <p>Replace a module's deck or video without a deploy. Paste the Canva <b>view</b> link or the Drive file link. Leave a box blank to use the address in <span class="mono">js/ln-course.js</span>.</p>
      ${links}
      <button class="btn btn-primary" onclick="saveCourseLinks()">Save course links</button>
    </section>`;
}
function viewPending(){
  return `<div class="login-shell"><div class="login-card"><img src="${LOGO_FULL_SRC}" alt="Legal Support Help" style="width:150px;height:auto;margin-bottom:18px">
    <h1 style="font-size:22px;color:var(--navy);margin:0 0 8px">Access paused</h1>
    <p style="font-size:14px;color:var(--ink-soft);font-weight:500">Your access to this course has been paused by a trainer. Please contact your trainer, or go back to the LSH Training Portal.</p>
    <p><a class="btn btn-primary" href="${PORTAL_HOME}">Go to the LSH Training Portal</a></p>
    <p><button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button></p></div></div>`;
}

function render(){
  const app = document.getElementById("app"); if(!app) return;
  let main;
  if(state.view === "boot") main = "";
  else if(state.view === "login" || (!state.isAdmin && !state.traineeId)) { state.view = "login"; app.innerHTML = window.portalGate.renderCard(); return; }
  else if(state.view === "pendingApproval") main = viewPending();
  else if(state.view === "admin" && state.isAdmin) main = viewAdmin();
  else if(state.view === "day" && dayByNum(state.dayNum)) main = viewDay();
  else if(state.view === "module" && moduleById(state.moduleId)) main = viewModule();
  else { state.view = "dashboard"; main = viewDashboard(); }
  app.innerHTML = (state.view === "pendingApproval" ? "" : topbar()) + `<main>${main}</main>` + footer();
}

/* ---------- boot ---------- */
(async function boot(){
  state.adminToken = stored(TOKEN_KEYS.admin); state.isAdmin = !!state.adminToken;
  const t = stored(TOKEN_KEYS.trainee); if(t) setTraineeToken(t);
  state.resumePending = true;
  await window.portalGate.init();   // asks /api/auth/status, then signs in whoever arrived from the Portal with a ticket
  // Open mode (no MASTER_ADMIN_PASSWORD on the Worker yet): the Worker treats every request as an admin's.
  if(!state.secure && !state.traineeId){ state.isAdmin = true; }
  await loadCourseLinks();
  if(state.traineeId && !state.isAdmin){
    await loadTrainee();
    if(traineeBlocked()) state.view = "pendingApproval";
  }
  if(state.view === "boot"){
    if(state.isAdmin) state.view = "dashboard";
    else if(state.traineeId){ state.view = "dashboard"; if(state.resumePending && typeof window.resumeWhereLeftOff === "function"){ window.resumeWhereLeftOff(); } }
    else state.view = "login";
  }
  render();
  document.documentElement.classList.remove("lsh-booting");
  // js/portal-gate.js covers the page while a Portal sign-in settles and lifts the cover from the engine's sign-in
  // card. This page goes straight to the dashboard instead, so it lifts the cover itself once the page is drawn.
  // (The cover is the gate's own element on <html>; the gate's later clean-up finds it gone and does nothing.)
  if(state.view !== "login") setTimeout(() => { [].forEach.call(document.documentElement.children, (el) => { if(el.tagName === "DIV" && el.style.zIndex === "2147483000") el.remove(); }); }, 150);
})();
</script>
