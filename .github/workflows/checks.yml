# Runs on every pull request and every push to main. A failure shows as a red
# "Checks" status on the PR/commit with a readable log. Nothing here deploys.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, files and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, every module's deck and video embed
        run: node .github/scripts/check-site.mjs
      - name: Single sign-on and storage rules (the Portal is the only way a trainee gets in; a trainee touches only their own records)
        run: node .github/scripts/sso.cjs
      - name: The Worker builds (nothing is deployed)
        run: npx --yes wrangler@3 deploy --dry-run --outdir=/tmp/wrangler-out
      - name: Smoke test in a browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          MASTER_ADMIN_PASSWORD=ci-admin PORTAL_SSO_SECRET=ci-portal node .github/scripts/server.mjs 8787 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8787/ && break; sleep 1; done
          node .github/scripts/smoke.cjs http://localhost:8787/
